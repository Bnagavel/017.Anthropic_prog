recipe: fatigue_ms_summary
version: 1.3.0
description: "Summarise fatigue margins of safety for a component from FEM + calc sheet + legacy report"
inputs:
  - role: fem_results
    accepts: [nastran_op2, nastran_f06]
  - role: calc_sheet
    accepts: [excel_calc]
  - role: legacy_report
    accepts: [digital_pdf]
    optional: true
extract:
  - field: applied_stress
    kind: stress
    source: fem_results
    unit: MPa
  - field: allowable_stress
    kind: stress
    source: calc_sheet
    unit: MPa
  - field: scatter_factor
    kind: other
    source: [calc_sheet, legacy_report]
compute:
  - ms = allowable_stress / (scatter_factor * applied_stress) - 1
checks: [negative_ms, low_scatter_factor, unit_consistency, missing_provenance]
narrate:
  sections: [scope, method, critical_locations, conclusions]
  style_source: legacy_report
  glossary: config/glossary/oem_a.yaml
output:
  excel_template: templates/excel/ms_summary_oem_a.xlsx
  word_template: templates/word/report_section_oem_a.docx

# F&DT-LocalAI Application Configuration (100% Offline Mode)
app:
  name: "F&DT Spectrum Assistant"
  version: "1.0.0"
  release: "Release 1.0 - SPECTRUM Spectrum Engine"
  offline_mode: true
  bind_host: "127.0.0.1"
  ui_port: 8501
  ollama_host: "http://127.0.0.1:11434"

paths:
  workspace_dir: "workspace"
  db_path: "workspace/fdt_evidence.sqlite"
  recipes_dir: "recipes"
  blueprints_dir: "blueprints"
  prompts_dir: "prompts"
  templates_dir: "templates"
  default_spectrum_folder: "Spectrum/example"

limits:
  max_excel_sheet_name_len: 31
  max_base_sheet_name_len: 19
  max_llm_context_tokens: 3000
  cpu_workers: 12
  gpu_concurrency: 1

security:
  allow_network_egress: false
  execute_excel_macros: false
  hf_hub_offline: 1
  transformers_offline: 1

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdt-localai"
version = "1.0.0"
description = "Offline, privacy-preserving AI & deterministic engineering assistant for Metallic Fatigue & Damage Tolerance (SPECTRUM Spectrum Engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Internal Engineering Use Only" }
authors = [
    { name = "F&DT Engineering Team" }
]
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "pytest>=8.0",
]

[project.optional-dependencies]
full = [
    "pint>=0.24",
    "pyNastran>=1.4",
    "rainflow>=3.2",
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "xlrd>=2.0",
    "rapidfuzz>=3.9",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "lancedb>=0.13",
    "ollama>=0.3",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "XlsxWriter>=3.2",
    "streamlit>=1.38",
]

[project.scripts]
fdt = "fdt_localai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests for individual parsers and engines",
    "contract: canonical data model contract tests",
    "integration: end-to-end spectrum pipeline integration tests",
    "eval: golden dataset numerical parity evaluation tests",
    "perf: performance benchmark tests (< 3s requirement)",
]
